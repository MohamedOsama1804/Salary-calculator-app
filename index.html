<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Salary &amp; Attendance Calculator</title>
<!--PWA:START-->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B4B78" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161E26" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salary Calc">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--PWA:END-->
<style>
:root {
  --bg: #ECEFF3; --surface: #FFFFFF; --surface-2: #F4F6F8;
  --ink: #141E28; --muted: #55626F; --line: #D2D9E0; --line-strong: #A9B5C1;
  --accent: #1B4B78; --accent-ink: #FFFFFF; --accent-soft: #E2ECF5;
  --pos: #12683F; --pos-soft: #E0F1E8; --neg: #A22B2B; --neg-soft: #FBE6E6;
  --warn: #754D00; --warn-soft: #FFF1CC;
  --radius: 6px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A; --surface: #161E26; --surface-2: #1C2630;
    --ink: #E5EBF0; --muted: #9BA9B6; --line: #2A3540; --line-strong: #46535F;
    --accent: #6BA6DD; --accent-ink: #0A1620; --accent-soft: #1A2B3B;
    --pos: #5CC796; --pos-soft: #143024; --neg: #F08C8C; --neg-soft: #3A1C1C;
    --warn: #E8B95A; --warn-soft: #3A2E12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #161E26; --surface-2: #1C2630;
  --ink: #E5EBF0; --muted: #9BA9B6; --line: #2A3540; --line-strong: #46535F;
  --accent: #6BA6DD; --accent-ink: #0A1620; --accent-soft: #1A2B3B;
  --pos: #5CC796; --pos-soft: #143024; --neg: #F08C8C; --neg-soft: #3A1C1C;
  --warn: #E8B95A; --warn-soft: #3A2E12;
  color-scheme: dark;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 56px); -webkit-text-size-adjust: 100%; overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
button, select, input, summary, a { touch-action: manipulation; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
.num, td.num, th.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app-header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 0 12px; }
.app-header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.005em; }
.app-header p { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); }

nav.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
nav.jump .wrap { display: flex; }
nav.jump a { display: inline-block; padding: 13px 12px; font-size: 14px; color: var(--muted); text-decoration: none; min-height: 44px; }
nav.jump a:hover { color: var(--ink); }
nav.jump a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

main { padding-bottom: 40px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 16px 0; }
.panel > h2, .h2 { font-size: 17px; font-weight: 650; margin: 0 0 12px; }
h3 { font-size: 14px; font-weight: 650; margin: 18px 0 8px; }
h3:first-child { margin-top: 0; }
p { margin: 0 0 8px; }
.hint { font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14.5px; margin: 4px 0; }

.notice { border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 12px; margin: 16px 0; font-size: 14.5px; background: var(--accent-soft); display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.notice.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.notice.bad { background: var(--neg-soft); color: var(--neg); border-color: var(--neg); }
.msg { font-size: 14px; margin: 8px 0 0; }
.msg.error { color: var(--neg); }
.msg.ok { color: var(--pos); }
.msg.warn { color: var(--warn); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .label { font-size: 13px; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 16px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
textarea { min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible, .table-wrap:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[aria-invalid="true"] { border-color: var(--neg); }
input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }
.err { font-size: 13px; color: var(--neg); }
.err:empty { display: none; }
.check { margin-top: 4px; display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; cursor: pointer; }
.check input { width: 22px; height: 22px; min-height: 22px; flex: none; accent-color: var(--accent); }
.grid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.grid.one { grid-template-columns: 1fr; }
.grid .span-all, .grid .span-m { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; display: inline-block; cursor: pointer; }
.chip input { position: absolute; opacity: 0; width: 100%; height: 100%; min-height: 0; margin: 0; left: 0; top: 0; cursor: pointer; }
.chip span { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); font-size: 14.5px; background: var(--surface); }
.chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn { font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--radius); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn.danger.armed { background: var(--neg); color: var(--surface); }
.btn.small { min-height: 38px; padding: 0 10px; font-size: 14px; }
.btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions .btn.primary { flex: 1 1 140px; }

/* Month bar */
.monthbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.month-title { font-size: 22px; font-weight: 650; line-height: 1.2; }
.month-controls { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.month-controls .field { gap: 0; }
.mc-pick { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
.mc-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mc-nav .btn { padding: 0 8px; white-space: nowrap; }

/* Summary */
.hero { border-top: 3px solid var(--accent); }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.answer .a-label { font-size: 13px; color: var(--muted); }
.answer .a-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.answer.primary { grid-column: 1 / -1; }
.big { font-size: clamp(32px, 9vw, 46px); font-weight: 700; line-height: 1.1; letter-spacing: -0.015em; margin: 2px 0; }
.mid { font-size: 21px; font-weight: 650; line-height: 1.2; margin: 2px 0; white-space: nowrap; }
.cur { font-size: 0.45em; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.mid .cur { font-size: 0.62em; }
.badge { display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 3px; border: 1px solid currentColor; vertical-align: middle; }
.badge.under { color: var(--neg); background: var(--neg-soft); }
.badge.over { color: var(--pos); background: var(--pos-soft); }
.badge.match { color: var(--accent); background: var(--accent-soft); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); margin-top: 16px; }
.stat { padding: 10px 0 0; }
.stat .s-label { font-size: 12.5px; color: var(--muted); }
.stat .s-val { font-size: 18px; font-weight: 650; }
.linkbtn { text-align: start; font: inherit; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 0; min-height: 32px; cursor: pointer; text-decoration: underline; }

.ledger { display: grid; grid-template-columns: 1fr; column-gap: 32px; margin: 0; }
.ledger .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ledger .row dt { color: var(--muted); font-size: 14.5px; margin: 0; }
.ledger .row dd { margin: 0; font-weight: 600; text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ledger .row.total { border-bottom: 0; border-top: 2px solid var(--ink); padding-top: 12px; margin-top: 4px; grid-column: 1 / -1; }
.ledger .row.total dt { color: var(--ink); font-weight: 650; }
.ledger .row.total dd { font-size: 20px; }
.ledger .row.sub dt { padding-inline-start: 14px; }
.ledger .row.sep { border-top: 1px solid var(--line-strong); }
.ledger.single { column-gap: 0; }

/* details/summary panels */
details.panel > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; min-height: 44px; padding: 0; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary .h2 { margin: 0; }
details.panel > summary .summary-line { font-size: 13.5px; color: var(--muted); flex: 1 1 200px; }
details.panel > summary .toggle { font-size: 14px; color: var(--accent); font-weight: 600; margin-inline-start: auto; }
details.panel:not([open]) > summary .toggle::after { content: attr(data-show); }
details.panel[open] > summary .toggle::after { content: attr(data-hide); }
details.panel[open] > summary { margin-bottom: 8px; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.att { min-width: 800px; }
table.adj { min-width: 520px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
th { font-size: 12.5px; font-weight: 650; color: var(--muted); background: var(--surface-2); text-align: start; }
td.num, th.num { text-align: end; }
td.num { white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
table.att th:first-child, table.att td:first-child { position: sticky; inset-inline-start: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--line); white-space: nowrap; }
table.att th:first-child { background: var(--surface-2); }
table.att tfoot td { font-weight: 650; border-top: 2px solid var(--line-strong); border-bottom: 0; background: var(--surface-2); }
table.att tfoot td:first-child { background: var(--surface-2); }
tr.invalid-row td { background: var(--neg-soft); }
tr.invalid-row td:first-child { background: var(--neg-soft); }
tr.selected td { background: var(--accent-soft); }
tr.selected td:first-child { background: var(--accent-soft); }
td.act { white-space: nowrap; }
td.act .btn.small { min-height: 34px; padding: 0 7px; font-size: 13px; }
td.act { padding-right: 8px; }
td .sub { display: block; font-size: 12px; color: var(--muted); }
.tag { display: inline-block; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 3px; font-size: 12.5px; white-space: nowrap; }
.tag.late { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
.tag.ot { color: var(--pos); background: var(--pos-soft); border-color: var(--pos); }
.tag.absent { color: var(--neg); background: var(--neg-soft); border-color: var(--neg); }
.tag.off { color: var(--muted); background: var(--surface-2); }

.detail-panel { margin-top: 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 12px; background: var(--surface-2); }
.detail-panel h3 { margin-top: 0; }
.detail-panel ul { margin: 0; padding-inline-start: 18px; font-size: 14.5px; }
.detail-panel li { margin-bottom: 4px; }

.tier-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
.formula { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.ledger .row dt { min-width: 0; }
.verdict { font-size: 16px; font-weight: 600; margin: 12px 0 4px; }
.preview { font-size: 14px; color: var(--ink); margin: 6px 0 0; }
.preview:empty { display: none; }

@media (min-width: 640px) {
  .month-controls { width: auto; flex-direction: row; align-items: flex-end; }
  .mc-pick { grid-template-columns: 150px 96px; }
  .mc-nav { grid-template-columns: repeat(3, auto); }
  .grid.c3 { grid-template-columns: repeat(3, 1fr); }
  .grid.c4 { grid-template-columns: repeat(4, 1fr); }
  .grid .span-m { grid-column: span 2; }
}
@media (min-width: 760px) {
  .answers { grid-template-columns: 1.5fr 1fr 1fr; gap: 0; }
  .answer { padding: 0 20px; }
  .answer.primary { grid-column: auto; padding-inline-start: 0; }
  .answer + .answer { border-inline-start: 1px solid var(--line); }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .ledger { grid-template-columns: 1fr 1fr; }
  .ledger.single { grid-template-columns: 1fr; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .two-col > .panel { margin: 16px 0; }
}
@media (min-width: 900px) {
  .actions .btn.primary { flex: 0 0 auto; }
}
@media (min-width: 1100px) { .scroll-hint { display: none; } }
@media print { nav.jump, .actions, .notice { display: none; } }

/* Language switch */
.lang-row { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.lang-switch { display: flex; direction: ltr; width: 100%; max-width: 320px; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.lang-switch button { flex: 1; font: inherit; font-size: 15px; font-weight: 600; min-height: 44px; padding: 0 16px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.lang-switch button + button { border-left: 1px solid var(--line-strong); }
.lang-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang-switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.emp-line { font-size: 14px; color: var(--muted); margin-top: 2px; }
.emp-line:empty { display: none; }
.saved-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.saved-row .s-name { font-weight: 600; }
.saved-row .s-meta { font-size: 13px; color: var(--muted); }
.saved-row.current .s-name::after { content: attr(data-cur-mark); font-weight: 400; color: var(--accent); font-size: 13px; margin-inline-start: 8px; }
textarea.plain { font-family: inherit; font-size: 16px; min-height: 84px; }
td .memo { display: block; font-size: 12px; color: var(--muted); max-width: 160px; overflow-wrap: anywhere; }

/* Right-to-left (Arabic) */
:lang(ar) body { line-height: 1.65; }
:lang(ar) *, :lang(ar) *::before, :lang(ar) *::after { letter-spacing: 0 !important; }
[dir="rtl"] input[type="number"], [dir="rtl"] input[type="time"], [dir="rtl"] input[type="date"] { direction: ltr; text-align: right; }
[dir="rtl"] table.att th:first-child, [dir="rtl"] table.att td:first-child { box-shadow: -1px 0 0 var(--line); }
[dir="rtl"] .summary-line { text-align: start; }
#backup-text { direction: ltr; text-align: left; }
@media (display-mode: standalone) { .app-header { padding-top: 10px; } }

/* Expenses (additive, reuses existing tokens only) */
table.exp { min-width: 620px; }
.cat-bars { display: flex; flex-direction: column; gap: 10px; }
.cat-bar-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14.5px; margin-bottom: 4px; }
.cat-bar-track { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.cat-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }

/* Expenses overlay: dedicated top-level tab (reuses existing tokens/classes only) */
.expenses-overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.expenses-overlay[hidden] { display: none; }
.expenses-overlay-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
.expenses-overlay-title { font-size: 17px; font-weight: 650; }
.expenses-overlay .wrap { padding-top: 4px; padding-bottom: 40px; }
body.expenses-open { overflow: hidden; }

</style>
</head>
<body>

<header class="app-header">
  <div class="wrap">
    <div class="lang-row">
      <div class="lang-switch" role="group" aria-label="Language / اللغة">
        <button type="button" data-lang="en" aria-pressed="true">English</button>
        <button type="button" data-lang="ar" lang="ar" aria-pressed="false">العربية</button>
      </div>
    </div>
    <h1 data-i18n="app_title"></h1>
    <p data-i18n="app_sub"></p>
  </div>
</header>

<nav class="jump" data-i18n-aria="nav_aria">
  <div class="wrap">
    <a href="#month" data-i18n="nav_month"></a>
    <a href="#summary" data-i18n="nav_summary"></a>
    <a href="#settings" data-i18n="nav_settings"></a>
    <a href="#quick-add" data-i18n="nav_add"></a>
    <a href="#attendance" data-i18n="nav_records"></a>
    <a href="#deductions" data-i18n="nav_deductions"></a>
    <a href="#additions" data-i18n="nav_additions"></a>
    <a href="#actual" data-i18n="nav_actual"></a>
    <a href="#expenses" data-i18n="nav_expenses"></a>
    <a href="#reconciliation" data-i18n="nav_recon"></a>
    <a href="#calc-detail" data-i18n="nav_calc"></a>
    <a href="#data" data-i18n="nav_data"></a>
  </div>
</nav>

<main class="wrap">

  <div class="notice" id="install-banner" hidden>
    <span data-i18n="install_text"></span>
    <span class="actions" style="margin:0">
      <button type="button" class="btn small primary" id="install-btn" data-i18n="install_btn"></button>
      <button type="button" class="btn small" id="install-dismiss" data-i18n="install_no"></button>
    </span>
  </div>
  <div class="notice" id="demo-banner" hidden>
    <span data-i18n="demo_text"></span>
    <span class="actions" style="margin:0">
      <button type="button" class="btn small" id="demo-clear" data-i18n="demo_clear"></button>
      <button type="button" class="btn small" id="demo-dismiss" data-i18n="demo_keep"></button>
    </span>
  </div>
  <div class="notice warn" id="storage-warning" hidden data-i18n="storage_warn"></div>
  <div class="notice warn" id="data-notice" hidden></div>

  <!-- Current month -->
  <section class="panel monthbar" id="month">
    <div>
      <div class="label" data-i18n="month_current"></div>
      <div class="month-title" id="month-title"></div>
      <div id="month-emp"></div>
    </div>
    <div class="month-controls">
      <div class="mc-pick">
        <div class="field"><label class="sr" for="m-month" data-i18n="month_label"></label><select id="m-month"></select></div>
        <div class="field"><label class="sr" for="m-year" data-i18n="year_label"></label><input id="m-year" type="number" inputmode="numeric" min="2000" max="2100" step="1"></div>
      </div>
      <div class="mc-nav">
        <button type="button" class="btn" id="m-prev" data-i18n="month_prev"></button>
        <button type="button" class="btn" id="m-next" data-i18n="month_next"></button>
        <button type="button" class="btn" id="m-today" data-i18n="month_this"></button>
      </div>
    </div>
    <div class="err" id="m-error" role="alert" style="width:100%"></div>
  </section>

  <!-- Summary -->
  <section class="panel hero" id="summary">
    <h2 data-i18n="sum_h"></h2>
    <div id="summary-hero"></div>
    <div id="summary-note"></div>
    <h3 style="margin-top:20px" data-i18n="sum_details"></h3>
    <dl class="ledger" id="summary-ledger"></dl>
  </section>

  <!-- Salary settings -->
  <details class="panel" id="settings">
    <summary><span class="h2" data-i18n="set_h"></span><span class="summary-line" id="settings-line"></span><span class="toggle"></span></summary>
    <div id="settings-body"></div>
  </details>

  <!-- Quick add -->
  <section class="panel" id="quick-add">
    <h2 id="att-title"></h2>
    <form id="att-form" novalidate autocomplete="off">
      <div class="grid c4">
        <div class="field"><label for="att-date" data-i18n="f_date"></label><input type="date" id="att-date" required></div>
        <div class="field"><label for="att-in" data-i18n="f_in"></label><input type="time" id="att-in"></div>
        <div class="field"><label for="att-out" data-i18n="f_out"></label><input type="time" id="att-out"></div>
        <div class="field"><label for="att-status" data-i18n="f_status"></label><select id="att-status"></select></div>
        <div class="field span-all"><label for="att-memo" data-i18n="f_note"></label><input id="att-memo" maxlength="200"></div>
      </div>
      <p class="hint" id="att-status-hint" style="margin:8px 0 0"></p>
      <div class="preview" id="att-preview" aria-live="polite"></div>
      <div class="msg error" id="att-error" role="alert" hidden></div>
      <div class="msg ok" id="att-ok" aria-live="polite" hidden></div>
      <div class="actions">
        <button type="submit" class="btn primary" id="att-submit"></button>
        <button type="button" class="btn" id="att-official" data-i18n="btn_official"></button>
        <button type="button" class="btn" id="att-cancel" hidden data-i18n="btn_cancel_edit"></button>
      </div>
    </form>
  </section>

  <!-- Attendance records -->
  <section class="panel" id="attendance">
    <h2 data-i18n="att_h"></h2>
    <div class="notice bad" id="att-alert" hidden></div>
    <div id="att-table"></div>
    <div id="att-detail"></div>
  </section>

  <div class="two-col">
    <section class="panel" id="deductions"></section>
    <section class="panel" id="additions"></section>
  </div>

  <!-- Actual salary received -->
  <section class="panel" id="actual">
    <h2 data-i18n="act_h"></h2>
    <div class="field" style="max-width:340px">
      <label for="actual-input" id="actual-label"></label>
      <input type="number" id="actual-input" inputmode="decimal" step="any" min="0" data-i18n-ph="act_ph">
      <div class="err" id="actual-error" role="alert"></div>
    </div>
    <div class="actions" style="margin-top:8px"><button type="button" class="btn small" id="actual-clear" data-i18n="act_clear"></button></div>
    <div id="actual-result"></div>
    <div class="field" style="margin-top:20px">
      <label for="month-notes" data-i18n="notes_label"></label>
      <textarea id="month-notes" maxlength="2000" style="font-family:inherit;font-size:16px;min-height:88px"></textarea>
    </div>
  </section>

  <!-- Reconciliation -->
  <section class="panel" id="reconciliation">
    <h2 data-i18n="rec_h"></h2>
    <div id="recon"></div>
  </section>

  <!-- Detailed calculation -->
  <details class="panel" id="calc-detail">
    <summary><span class="h2" data-i18n="calc_h"></span><span class="summary-line" id="calc-line"></span><span class="toggle"></span></summary>
    <div id="calc-body"></div>
  </details>

  <!-- Data -->
  <section class="panel" id="data">
    <h2 data-i18n="data_h"></h2>
    <p class="hint" data-i18n="data_hint"></p>
    <div id="data-status" class="hint" style="margin-bottom:8px"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="export-btn" data-i18n="btn_export"></button>
      <button type="button" class="btn" id="import-btn" data-i18n="btn_import"></button>
      <input type="file" id="import-file" accept=".json,application/json" class="sr" tabindex="-1">
    </div>
    <div class="msg" id="data-msg" aria-live="polite" hidden></div>
    <div class="notice" id="import-confirm" hidden style="margin-bottom:0"></div>
    <details id="backup-text-box" style="margin-top:12px">
      <summary style="min-height:44px;cursor:pointer;display:flex;align-items:center;color:var(--accent);font-weight:600" data-i18n="bk_summary"></summary>
      <div class="field"><label for="backup-text" data-i18n="bk_label"></label><textarea id="backup-text" class="mono" spellcheck="false" dir="ltr"></textarea></div>
      <div class="actions">
        <button type="button" class="btn" id="copy-btn" data-i18n="bk_copy"></button>
        <button type="button" class="btn" id="import-text-btn" data-i18n="bk_import"></button>
      </div>
    </details>
    <h3 style="margin-top:24px" data-i18n="sm_h"></h3>
    <div id="saved-months"></div>
    <h3 style="margin-top:24px" data-i18n="clear_h"></h3>
    <div class="actions" style="margin-top:0">
      <button type="button" class="btn danger" id="clear-month-btn" data-i18n="btn_clear_month"></button>
      <button type="button" class="btn danger" id="reset-btn" data-i18n="btn_reset"></button>
    </div>
    <p class="hint" style="margin-top:8px" data-i18n="clear_hint"></p>
  </section>
</main>

<!-- Expenses: dedicated top-level tab, entirely separate from the main scrolling page -->
<div class="expenses-overlay" id="expenses-overlay" hidden>
  <div class="expenses-overlay-bar">
    <button type="button" class="btn small" id="expenses-back" data-i18n="exp_back"></button>
    <span class="expenses-overlay-title" data-i18n="exp_h"></span>
  </div>
  <div class="wrap">
    <section class="panel" id="expenses">
      <h2 id="exp-title"></h2>
      <form id="exp-form" novalidate autocomplete="off">
        <div class="grid">
          <div class="field"><label for="exp-amount" data-cur-i18n="f_amount"></label><input id="exp-amount" type="number" inputmode="decimal" step="any" min="0"></div>
          <div class="field"><label for="exp-date" data-i18n="f_date"></label><input id="exp-date" type="date"></div>
          <div class="field span-all"><label for="exp-category" data-i18n="exp_category"></label><select id="exp-category"></select></div>
          <div class="field span-all" id="exp-custom-wrap" hidden><label for="exp-custom" data-i18n="exp_custom_label"></label><input id="exp-custom" maxlength="40"></div>
          <div class="field span-all"><label for="exp-note" data-i18n="f_note"></label><input id="exp-note" maxlength="200"></div>
        </div>
        <div class="msg error" id="exp-error" role="alert" hidden></div>
        <div class="actions">
          <button type="submit" class="btn primary" id="exp-submit"></button>
          <button type="button" class="btn" id="exp-cancel" hidden data-i18n="btn_cancel_edit"></button>
        </div>
      </form>

      <div id="exp-summary" style="margin-top:20px"></div>

      <h3 style="margin-top:20px" data-i18n="exp_list_h"></h3>
      <div class="grid c3">
        <div class="field"><label for="exp-filter-cat" data-i18n="exp_category"></label><select id="exp-filter-cat"></select></div>
        <div class="field"><label for="exp-filter-from" data-i18n="exp_filter_from"></label><input id="exp-filter-from" type="date"></div>
        <div class="field"><label for="exp-filter-to" data-i18n="exp_filter_to"></label><input id="exp-filter-to" type="date"></div>
      </div>
      <div class="actions" style="margin-top:8px"><button type="button" class="btn small" id="exp-filter-clear" data-i18n="exp_filter_clear"></button></div>
      <div id="exp-table" style="margin-top:16px"></div>
    </section>
  </div>
</div>

      L.push(t('dl_ot_pay', { h: (d.otMin / 60).toFixed(2), hourly: money(r.hourly), mult: trimNum(s.otMultiplier), amt: money(d.otPay, c) }));

/* Totals and per-category breakdown for one month. Reads only md.expenses — never touches Calc or M/R. */
function computeExpenses(md) {
  const items = md.expenses.slice().sort((a, b) => (a.date || '') < (b.date || '') ? -1 : (a.date || '') > (b.date || '') ? 1 : 0);
  const total = round2(items.reduce((a, x) => a + x.amount, 0));
  const byCategory = {};
  items.forEach(x => { byCategory[x.category] = round2((byCategory[x.category] || 0) + x.amount); });
  return { items: items, total: total, count: items.length, byCategory: byCategory };
}

function onExpenseSubmit(e) {
  e.preventDefault();

  const amountEl = $('#exp-amount');
  const amount = (amountEl.value === '' || amountEl.validity.badInput) ? NaN : amountEl.valueAsNumber;
  const date = $('#exp-date').value;
  let category = $('#exp-category').value;
  const custom = $('#exp-custom').value.trim();
  const note = $('#exp-note').value.trim();
  const errors = [];
  if (!isNum(amount)) errors.push(t('a_err_amount'));
  else if (amount <= 0) errors.push(t('a_err_positive'));
  else if (amount > 1e9) errors.push(t('a_err_big'));
  if (!parseISO(date)) errors.push(t('a_err_date'));
  if (!category) errors.push(t('exp_err_category'));
  else if (category === '__custom__') {
    if (!custom) errors.push(t('exp_err_custom'));
    else if (custom.length > 40) errors.push(t('exp_err_custom_big'));
  }
  const box = $('#exp-error');
  if (errors.length) { box.hidden = false; box.textContent = errors.join(' '); return; }
  if (category === '__custom__') {
    category = custom.slice(0, 40);

  }
  const item = { id: ui.editing.exp || uid(), date: date, category: category, amount: amount, note: note.slice(0, 200) };

function onSettingEvent(e) {
  const el = e.target, key = el.dataset && el.dataset.setting;
  if (!key) return;
  const s = cur().settings, kind = el.dataset.kind, errEl = $('[data-err="' + key + '"]') || document.createElement('div');

  if (kind === 'number') val = (el.value === '' || (el.validity && el.validity.badInput)) ? NaN : el.valueAsNumber;
  else if (kind === 'checkbox') val = el.checked;
  else val = el.value;
  if (kind === 'text') val = val.trim();
  const cand = Object.assign({}, s, { [key]: val });
  const err = validateSetting(key, val, cand);
  if (err) {
    if (e.type === 'change') { restoreField(key); errEl.textContent = errText(err) + ' ' + t('v_restored'); }

    return;
  }
  el.removeAttribute('aria-invalid');
  errEl.textContent = '';
  s[key] = val;
  if (key === 'lateMethod') {
    s.lateRate = val === 'daily' ? 0.25 : 1;

}

function suggestDate() {
  const y = state.selected.y, m = state.selected.m, dim = daysInMonth(y, m), tt = todayISO();
  const have = {}; cur().records.forEach(r => { have[r.date] = true; });
  const start = (tt >= isoDate(y, m, 1) && tt <= isoDate(y, m, dim)) ? parseISO(tt).d : 1;
  for (let d = start; d <= dim; d++) if (!have[isoDate(y, m, d)]) return isoDate(y, m, d);
  return isoDate(y, m, start);
}
function nextFreeAfter(iso) {
  const p = parseISO(iso), y = state.selected.y, m = state.selected.m, dim = daysInMonth(y, m);
  const have = {}; cur().records.forEach(r => { have[r.date] = true; });
  for (let d = p.d + 1; d <= dim; d++) if (!have[isoDate(y, m, d)]) return isoDate(y, m, d);

}

function showAttMsg(err, ok) {

function validateRecord(rec, excludeId) {
  const errors = [], md = cur();
  const p = parseISO(rec.date);
  if (!rec.date) errors.push(E('e_date_required'));
  else if (!p) errors.push(E('e_date_invalid'));
  else if (p.y !== state.selected.y || p.m !== state.selected.m) errors.push(E('e_date_month', { month: monthName(state.selected.m) + ' ' + state.selected.y }));
  else if (md.records.some(r => r.date === rec.date && r.id !== excludeId)) errors.push(E('e_dup', { date: fmtShort(rec.date) }));
  if (!errors.length) Calc.computeDay(rec, md.settings).errors.forEach(x => errors.push(x));
  return errors;
}

  const d = Calc.computeDay({ id: 'preview', date: f.date, checkIn: f.checkIn, checkOut: f.checkOut, status: f.status }, s);
  if (!d.valid) { box.textContent = ''; return; }
  const parts = [statusName(d.labelKey)];
  parts.push(d.lateMin > 0 ? t('pv_late', { d: dur(d.lateMin), amt: negMoney(d.lateDed, s.currency) }) : t('pv_no_late'));
  parts.push(d.otMin > 0 ? t('pv_ot', { d: dur(d.otMin), amt: signedMoney(d.otPay, s.currency) }) : (f.checkOut ? t('pv_no_ot') : t('pv_no_out')));

function onAttSubmit(e) {

    return;
  }
  err.textContent = ''; el.removeAttribute('aria-invalid');
  md.actualReceived = v;
  save(); renderCalculated();
}

/* =====================================================================
   MONTH SWITCHING
   ===================================================================== */
function setMonth(y, m0) {
  state.selected = { y: y, m: m0 };
  ensureMonth(curKey());
  ui.editing = { att: null, ded: null, add: null };
  ui.detailId = null;
  $('#m-month').value = String(m0);
  $('#m-year').value = String(y);
  $('#m-error').textContent = '';
  fillSettings();
  setDateBounds();
  resetAttForm();
  resetAdjForm('ded'); resetAdjForm('add');
  resetExpenseForm(); resetExpenseFilterUI();
  const md = cur();
  $('#actual-input').value = md.actualReceived == null ? '' : md.actualReceived;
  $('#actual-error').textContent = '';
  $('#month-notes').value = md.notes || '';
  save();
  renderCalculated();
}
function shiftMonth(delta) {
  let y = state.selected.y, m = state.selected.m + delta;
  while (m < 0) { m += 12; y--; }
  while (m > 11) { m -= 12; y++; }
  if (y < 2000 || y > 2100) { $('#m-error').textContent = t('m_err_range'); return; }
  setMonth(y, m);
}

/* =====================================================================
   DATA: export / import / clear
   ===================================================================== */
let downloadsCap = null;
function dataMsg(text, kind) {
  const el = $('#data-msg');
  el.hidden = !text; el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}
function exportPayload() {
  return { app: 'salary-attendance-calculator', version: 1, exportedAt: new Date().toISOString(), data: state };
}
async function doExport() {
  state.lastBackup = new Date().toISOString();
  save();
  renderDataStatus();
  const text = JSON.stringify(exportPayload(), null, 2);
  const name = 'salary-attendance-backup-' + todayISO() + '.json';
  $('#backup-text').value = text;
  if (downloadsCap) {
    try { await downloadsCap.save({ filename: name, data: text }); dataMsg(t('dm_saved', { name: name }), 'ok'); return; }
    catch (e) {
      if (e && e.code === 'declined') { dataMsg(t('dm_cancelled'), ''); return; }
    }
  }
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    dataMsg(t('dm_created', { name: name }), 'ok');
  } catch (e) { dataMsg(t('dm_nofile'), 'warn'); }
  $('#backup-text-box').open = true;
}
async function doCopy() {
  if (!$('#backup-text').value) $('#backup-text').value = JSON.stringify(exportPayload(), null, 2);
  const ta = $('#backup-text');
  try { await navigator.clipboard.writeText(ta.value); dataMsg(t('dm_copied'), 'ok'); return; } catch (e) { /* fall through */ }
  try { ta.focus(); ta.select(); const ok = document.execCommand('copy'); dataMsg(ok ? t('dm_copied') : t('dm_manual'), ok ? 'ok' : 'warn'); }
  catch (e) { dataMsg(t('dm_manual'), 'warn'); }
}
function stageImport(text) {
  let res;
  try { res = sanitizeState(JSON.parse(text)); }
  catch (e) { ui.staged = null; $('#import-confirm').hidden = true; dataMsg(t('dm_invalid'), 'error'); return; }
  ui.staged = res;
  const months = Object.keys(res.state.months).length;
  const recs = Object.keys(res.state.months).reduce((a, k) => a + res.state.months[k].records.length, 0);
  const box = $('#import-confirm');
  box.hidden = false;
  box.innerHTML = '<span>' + esc(t('im_text', { months: pl('month', months), recs: pl('attrec', recs) }) + (res.fixes ? ' ' + t('im_fixes', { items: pl('item', res.fixes) }) : '') + ' ' + t('im_replace')) + '</span>' +
    '<span class="actions" style="margin:0"><button type="button" class="btn small primary" id="import-go">' + t('im_go') + '</button><button type="button" class="btn small" id="import-cancel">' + t('b_cancel') + '</button></span>';
  dataMsg('', '');
}
function applyImport() {
  if (!ui.staged) return;
  state = ui.staged.state; ui.staged = null;
  $('#import-confirm').hidden = true;
  updateBanner();
  setMonth(state.selected.y, state.selected.m);
  dataMsg(t('dm_imported'), 'ok');
}
function updateBanner() { $('#demo-banner').hidden = !state.demo; }
function armConfirm(btn, labelKey, action) {
  if (btn.dataset.armed) { clearTimeout(+btn.dataset.timer); delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = btn.dataset.label; action(); return; }
  btn.dataset.label = btn.textContent; btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = t(labelKey);
  btn.dataset.timer = String(setTimeout(function () { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = btn.dataset.label; }, 4000));
}
function clearMonth() {
  const md = cur();
  md.records = []; md.deductions = []; md.additions = []; md.actualReceived = null; md.notes = '';
  save(); setMonth(state.selected.y, state.selected.m);
  dataMsg(t('dm_cleared', { month: monthName(state.selected.m) + ' ' + state.selected.y }), 'ok');
}
function resetAll() {
  const name = state.profile ? state.profile.name : '';
  state = defaultState();
  state.profile.name = name;
  updateBanner();
  setMonth(state.selected.y, state.selected.m);
  dataMsg(t('dm_reset'), 'ok');
}

/* =====================================================================
   LANGUAGE SWITCH
   ===================================================================== */
function initialLang() {
  let l = null;
  try { l = localStorage.getItem(LANG_KEY); } catch (e) { /* ignore */ }
  if (l === 'ar' || l === 'en') return l;
  return /^ar/i.test(navigator.language || '') ? 'ar' : 'en';
}
function setLang(l, persist) {
  LANG = l === 'ar' ? 'ar' : 'en';
  if (persist) { try { localStorage.setItem(LANG_KEY, LANG); } catch (e) { /* ignore */ } }
  const de = document.documentElement;
  de.lang = LANG === 'ar' ? 'ar-EG' : 'en';
  de.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  $$('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  applyStatic();
  if (state) {
    buildMonthSelect(); buildStatusSelect(); buildSettings(); buildAdjust('ded'); buildAdjust('add'); buildExpenseForm();
    setMonth(state.selected.y, state.selected.m);
  }
}

/* =====================================================================
   INSTALL PROMPT (Android Chrome)
   ===================================================================== */
let deferredPrompt = null;
const isStandalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
function initInstall() {
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    let dismissed = false;
    try { dismissed = localStorage.getItem(INSTALL_KEY) === '1'; } catch (x) { /* ignore */ }
    if (!dismissed && !isStandalone()) $('#install-banner').hidden = false;
  });
  window.addEventListener('appinstalled', () => { $('#install-banner').hidden = true; deferredPrompt = null; });
  $('#install-btn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch (e) { /* ignore */ }
    deferredPrompt = null;
    $('#install-banner').hidden = true;
  });
  $('#install-dismiss').addEventListener('click', () => {
    $('#install-banner').hidden = true;
    try { localStorage.setItem(INSTALL_KEY, '1'); } catch (e) { /* ignore */ }
  });
}

/* =====================================================================
   EVENTS
   ===================================================================== */
function bindEvents() {
  // Language
  $$('.lang-switch button').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang !== LANG) setLang(b.dataset.lang, true); }));

  // Month
  $('#m-prev').addEventListener('click', () => shiftMonth(-1));
  $('#m-next').addEventListener('click', () => shiftMonth(1));
  $('#m-today').addEventListener('click', () => { const tp = parseISO(todayISO()); setMonth(tp.y, tp.m); });
  $('#m-month').addEventListener('change', () => setMonth(state.selected.y, +$('#m-month').value));
  $('#m-year').addEventListener('change', () => {
    const v = $('#m-year').valueAsNumber;
    if (!isNum(v) || !Number.isInteger(v) || v < 2000 || v > 2100) { $('#m-error').textContent = t('m_err_year'); $('#m-year').value = state.selected.y; return; }
    setMonth(v, state.selected.m);
  });

  // Settings (delegated, because the form is rebuilt when the language changes)
  const sb = $('#settings-body');
  sb.addEventListener('input', onSettingEvent);
  sb.addEventListener('change', onSettingEvent);
  sb.addEventListener('input', onTierEvent);
  sb.addEventListener('change', onTierEvent);
  sb.addEventListener('input', e => {
    if (e.target.id !== 'emp-name') return;
    state.profile.name = e.target.value.trim().slice(0, 60);
    save(); renderMonthTitle();
  });
  sb.addEventListener('change', e => {
    const w = e.target.dataset && e.target.dataset.weekday;
    if (w === undefined) return;
    const s = cur().settings, n = +w;
    const set = new Set(s.weekendDays);
    if (e.target.checked) set.add(n); else set.delete(n);
    s.weekendDays = Array.from(set).sort();
    save(); renderCalculated();
  });
  sb.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const s = cur().settings;
    if (b.dataset.ot) {
      s.otMultiplier = parseFloat(b.dataset.ot);
      $('#s-otMultiplier').value = s.otMultiplier;
      $('[data-err="otMultiplier"]').textContent = '';
      refreshOtPresets(); save(); renderCalculated();
    } else if (b.id === 'tier-add') {
      const last = s.lateTiers.reduce((a, x) => Math.max(a, x.from), 0);
      if (s.lateTiers.length >= 20) { $('#tiers-err').textContent = t('tier_max'); return; }
      s.lateTiers.push({ from: last + 30, value: 0 });
      renderTiers(); save(); renderCalculated();
    } else if (b.dataset.tierRemove !== undefined) {
      s.lateTiers.splice(+b.dataset.tierRemove, 1);
      renderTiers(); save(); renderCalculated();
    }
  });

  // Attendance form
  $('#att-form').addEventListener('submit', onAttSubmit);
  ['#att-date', '#att-in', '#att-out'].forEach(id => $(id).addEventListener('input', () => { showAttMsg('', ''); updateAttPreview(); }));
  $('#att-status').addEventListener('change', () => { syncStatusUI(); showAttMsg('', ''); updateAttPreview(); });
  $('#att-official').addEventListener('click', () => {
    const s = cur().settings;
    if (NON_WORK.indexOf($('#att-status').value) >= 0) { $('#att-status').value = 'auto'; syncStatusUI(); }
    $('#att-in').value = s.startTime; $('#att-out').value = s.endTime;
    showAttMsg('', ''); updateAttPreview();
  });
  $('#att-cancel').addEventListener('click', () => resetAttForm());

  // Attendance table (delegation)
  $('#attendance').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (act === 'edit') startEditAtt(id);
    else if (act === 'detail') { ui.detailId = ui.detailId === id ? null : id; renderAttendance(); renderAttDetail(); if (ui.detailId) $('#att-detail').scrollIntoView({ block: 'nearest' }); }
    else if (act === 'detail-close') { ui.detailId = null; renderAttendance(); renderAttDetail(); }
    else if (act === 'del') armConfirm(b, 'b_confirm', () => {
      const md = cur();
      md.records = md.records.filter(r => r.id !== id);
      if (ui.editing.att === id) resetAttForm();
      if (ui.detailId === id) ui.detailId = null;
      save(); renderCalculated();
    });
  });

  // Deductions / additions (delegated on the section, because the forms are rebuilt with the language)
  ['ded', 'add'].forEach(p => {
    const sec = $('#' + ADJ[p].key);
    sec.addEventListener('submit', e => { if (e.target.id === p + '-form') onAdjSubmit(p, e); });
    sec.addEventListener('click', e => {
      if (e.target.id === p + '-cancel') { resetAdjForm(p); return; }
      const b = e.target.closest('button[data-adj]');
      if (!b || b.dataset.adj !== p) return;
      const id = b.dataset.id;
      if (b.dataset.act === 'edit') startEditAdj(p, id);
      else armConfirm(b, 'b_confirm', () => {
        const md = cur();
        md[ADJ[p].key] = md[ADJ[p].key].filter(x => x.id !== id);
        if (ui.editing[p] === id) resetAdjForm(p);
        save(); renderCalculated();
      });
    });
  });

  // Expenses (delegated on the section, because the form/list are rebuilt with the language)
  const expSec = $('#expenses');
  expSec.addEventListener('submit', e => { if (e.target.id === 'exp-form') onExpenseSubmit(e); });
  expSec.addEventListener('change', e => { if (e.target.id === 'exp-category') onExpenseCategoryChange(); });
  expSec.addEventListener('click', e => {
    if (e.target.id === 'exp-cancel') { resetExpenseForm(); return; }
    if (e.target.id === 'exp-filter-clear') { resetExpenseFilterUI(); renderExpenses(); return; }
    const b = e.target.closest('button[data-exp-act]');
    if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.expAct === 'edit') startEditExpense(id);
    else armConfirm(b, 'b_confirm', () => {
      const md = cur();
      md.expenses = md.expenses.filter(x => x.id !== id);
      if (ui.editing.exp === id) resetExpenseForm();
      save(); renderExpenses();
    });
  });
  $('#exp-filter-cat').addEventListener('change', () => { ui.expFilter.category = $('#exp-filter-cat').value; renderExpenses(); });
  $('#exp-filter-from').addEventListener('change', () => { ui.expFilter.from = $('#exp-filter-from').value; renderExpenses(); });
  $('#exp-filter-to').addEventListener('change', () => { ui.expFilter.to = $('#exp-filter-to').value; renderExpenses(); });

  // Actual salary and notes
  $('#actual-input').addEventListener('input', onActualInput);
  $('#actual-input').addEventListener('change', onActualInput);
  $('#actual-clear').addEventListener('click', () => { $('#actual-input').value = ''; onActualInput({ type: 'input' }); });
  $('#month-notes').addEventListener('input', e => { cur().notes = e.target.value.slice(0, 2000); save(); renderSavedMonths(); });

  // Shortcuts and navigation
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-goto]');
    if (g) {
      if (!$('#expenses-overlay').hidden) closeExpensesOverlay();
      const tg = document.getElementById(g.dataset.goto); if (tg) { tg.scrollIntoView({ block: 'start' }); if (g.dataset.goto === 'actual') $('#actual-input').focus(); }
    }
    const a = e.target.closest('nav.jump a');
    if (a) {
      if (a.getAttribute('href') === '#expenses') { e.preventDefault(); openExpensesOverlay(); return; }
      const tg = document.querySelector(a.getAttribute('href')); if (tg && tg.tagName === 'DETAILS') tg.open = true;
    }
    const om = e.target.closest('[data-open-month]');
    if (om) { const k = om.dataset.openMonth; setMonth(+k.slice(0, 4), +k.slice(5) - 1); $('#month').scrollIntoView({ block: 'start' }); }
  });
  $('#expenses-back').addEventListener('click', closeExpensesOverlay);

  // Data
  $('#export-btn').addEventListener('click', doExport);
  $('#copy-btn').addEventListener('click', doCopy);
  $('#import-btn').addEventListener('click', () => $('#import-file').click());
  $('#import-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => stageImport(String(rd.result));
    rd.onerror = () => dataMsg(t('dm_unreadable'), 'error');
    rd.readAsText(f);
    e.target.value = '';
  });
  $('#import-text-btn').addEventListener('click', () => {
    const tx = $('#backup-text').value.trim();
    if (!tx) { dataMsg(t('dm_paste_first'), 'error'); return; }
    stageImport(tx);
  });
  $('#import-confirm').addEventListener('click', e => {
    if (e.target.id === 'import-go') applyImport();
    if (e.target.id === 'import-cancel') { ui.staged = null; $('#import-confirm').hidden = true; }
  });
  $('#clear-month-btn').addEventListener('click', e => armConfirm(e.currentTarget, 'b_press_clear', clearMonth));
  $('#reset-btn').addEventListener('click', e => armConfirm(e.currentTarget, 'b_press_reset', resetAll));
  $('#demo-clear').addEventListener('click', resetAll);
  $('#demo-dismiss').addEventListener('click', () => { state.demo = false; save(); updateBanner(); });

  // Keep data safe when the app goes to the background or closes
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
  window.addEventListener('pagehide', save);
}

/* =====================================================================
   START
   ===================================================================== */
function init() {
  LANG = initialLang();
  storageOK = detectStorage();
  $('#storage-warning').hidden = storageOK;
  const loaded = loadState();
  state = loaded.state || (loaded.status === 'unreadable' ? defaultState() : demoState());
  if (loaded.status === 'recovered') { const n = $('#data-notice'); n.textContent = t('dn_recovered'); n.hidden = false; }
  if (loaded.status === 'unreadable') { const n = $('#data-notice'); n.textContent = t('dn_unreadable'); n.hidden = false; }
  setLang(LANG, false);
  buildMonthSelect(); buildStatusSelect(); buildSettings(); buildAdjust('ded'); buildAdjust('add'); buildExpenseForm();
  bindEvents();
  initInstall();
  updateBanner();
  setMonth(state.selected.y, state.selected.m);
  requestPersist();
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function (d) { downloadsCap = d || null; }).catch(function () { downloadsCap = null; });
    }
  } catch (e) { downloadsCap = null; }
}

// Small hook so the calculation engine can be tested from the console or a test runner.
window.SalaryApp = {
  Calc: Calc, getState: () => state, setToday: iso => { todayOverride = iso; if (state) renderCalculated(); },
  computed: () => ({ M: M, R: R }), sanitizeState: sanitizeState, setLang: l => setLang(l, true), getLang: () => LANG, t: t, I18N: I18N
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
</script>
